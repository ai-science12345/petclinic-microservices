name: PetClinic GHCR Build and Scan

on:
  push:
    branches:
      - feature/eks-cicd
    paths:
      - 'spring-petclinic-*/**'
      - 'docker/Dockerfile'
      - 'pom.xml'
      - '.github/workflows/ghcr-build.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - admin-server
          - api-gateway
          - config-server
          - customers-service
          - discovery-server
          - genai-service
          - vets-service
          - visits-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Maven module
        run: |
          ./mvnw --no-transfer-progress --batch-mode \
            -pl spring-petclinic-${{ matrix.service }} \
            -am -DskipTests clean package

      - name: Prepare Docker artifact
        run: |
          cp spring-petclinic-${{ matrix.service }}/target/*.jar \
             spring-petclinic-${{ matrix.service }}.jar

      - name: Set image metadata
        id: meta
        run: |
          declare -A PORTS=(
            [config-server]=8888
            [discovery-server]=8761
            [api-gateway]=8080
            [customers-service]=8081
            [visits-service]=8082
            [vets-service]=8083
            [genai-service]=8084
            [admin-server]=9090
          )

          echo "port=${PORTS[${{ matrix.service }}]}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/spring-petclinic-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          build-args: |
            ARTIFACT_NAME=spring-petclinic-${{ matrix.service }}
            EXPOSED_PORT=${{ steps.meta.outputs.port }}

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.71.0

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          skip-setup-trivy: true
          image-ref: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'
